version: 2

# Two ecosystems, both of which this repository ships a control about.
#
# `github.supply-chain.workflow-pinning` fails any third-party action pinned to a mutable tag, so
# the actions here are pinned to commit revisions — which means nothing updates them unless
# something is watching. That is the trade a revision pin makes, and dependabot is the other half
# of it. Without this file the pinning check would be satisfied by a set of actions frozen at
# whatever was current the day they were written, which is a supply-chain posture rather than a
# supply-chain control.
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: actions

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: deps
    groups:
      # The AWS SDK publishes daily across ten clients. Grouped, or the queue is nothing else.
      aws-sdk:
        patterns:
          - "@aws-sdk/*"

  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: deps(web)
    groups:
      # react and react-dom declare a peer dependency on each other, so a bump to either one
      # alone does not install. Ungrouped, dependabot opened #47 (react) and #48 (react-dom)
      # separately and both failed at `npm ci`:
      #
      #   Conflicting peer dependency: react@18.3.1
      #   peer react-dom@"^18.2.0 || ... || ^19.0.0" from next@15.5.25
      #
      # Neither could ever have merged on its own, and neither was wrong -- the pair simply has
      # to move together. The @types packages are in the group for the same reason one version
      # behind the runtime is a type error rather than a warning.
      react:
        patterns:
          - react
          - react-dom
          - "@types/react"
          - "@types/react-dom"

  - package-ecosystem: docker
    directory: /web
    schedule:
      interval: weekly
    commit-message:
      prefix: docker
