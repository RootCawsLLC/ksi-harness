name: ccm

# Continuous control monitoring: collect against live systems on a schedule, report, and escalate
# when the evidence stops supporting a claim.
#
# The schedule is the control. Several indicators use the word "persistently", which FedRAMP defines
# rather than leaves to the reader, and a check that runs when someone remembers to run it does not
# satisfy it. The harness records collection history and compares the observed interval against the
# cadence each route declares, so an unreliable schedule shows up as a cadence failure in the
# coverage report rather than as an absence nobody notices.
#
# That mechanism only works if the locker survives the run. It used to not. This workflow checked
# the repository out fresh, collected into a gitignored directory, uploaded it as an artifact that
# nothing ever read back, and started from nothing again the next morning. `observedIntervalDays`
# needs two runs to report an interval at all, so every assessment reported "only one run so far",
# `cadence_unmet` was structurally zero, and the argument that a scheduled collection evidences
# FRD-PER rested on history the pipeline was throwing away. Restoring and republishing the locker
# is steps one and last below, and it is the whole reason the rest of this file is worth running.
#
# There are three collection modes, and the run says which one it used rather than blurring them:
#
#   live         A collector role is configured, so everything the profile declares is collected.
#   github-live  No cloud role, but the GitHub half needs no secret beyond the workflow token, so it
#                runs for real against the repositories the profile declares. This is the default,
#                and it is why "continuous" here is a description rather than an aspiration.
#   fixtures     Explicitly requested. Produces demo evidence and never escalates or publishes.
#
# Credentials for the cloud half come from OIDC rather than long-lived keys — aws.iam.mfa-coverage
# and aws.iam.privileged-access both fail on standing access, and a permanent CI access key in a
# repository secret is exactly that. The role should be read-only.

on:
  schedule:
    # 04:15 UTC daily. Offset from the hour because every scheduler on GitHub fires on it.
    - cron: '15 4 * * *'
  workflow_dispatch:
    inputs:
      fixtures_only:
        description: 'Run against fixtures instead of live systems'
        type: boolean
        default: false

permissions:
  contents: read
  pull-requests: read
  id-token: write
  issues: write

# Branch protection is readable only with `administration: read`, and that scope cannot be granted
# to the workflow token — it is not one of the keys `permissions:` accepts, and asking for it makes
# the whole file fail to parse. Reading it therefore needs a PAT or App token in
# `KSI_GITHUB_READ_TOKEN`.
#
# Without that secret the run is still honest rather than wrong: the collector classifies the 403 as
# a permission failure and records `github.change.branch-protection` as a warning that names the
# missing scope, instead of passing it or failing it. An unverifiable control and a satisfied one are
# different facts, and this is the case that distinction was built for.

jobs:
  collect:
    runs-on: ubuntu-latest
    permissions:
      contents: write # to publish the evidence locker to its own branch
      pull-requests: read
      id-token: write # OIDC, for both the collector role and keyless signing
      issues: write
    env:
      # Override with a repository variable to monitor a different boundary. The default is this
      # repository, which is the only boundary these credentials can actually see.
      PROFILE: ${{ vars.KSI_PROFILE || 'examples/self.profile.yaml' }}
      # The branch the locker lives on. A branch keeps evidence history out of the source history,
      # and it is trivially swapped for the private append-only store a real deployment needs: a
      # bundle names accounts, roles, buckets and failing resources, which is an accurate inventory
      # of where a boundary is weakest. Publishing it from a public repository is defensible only
      # because this repository monitors itself and every fact in its locker is already public.
      KSI_EVIDENCE_BRANCH: ${{ vars.KSI_EVIDENCE_BRANCH || 'evidence' }}
      LOCKER: .locker/evidence
      #
      # How much evidence there was supposed to be. The chain, the manifest, the signature and the
      # timestamp all live inside the locker, so they protect it against alteration and not against
      # removal; this file is what notices a locker that came back smaller than it went in.
      #
      # Where the anchor is staged locally. Where it actually *lives* is decided by
      # KSI_ANCHOR_REPO below, and that distinction is the whole mechanism.
      #
      # Set KSI_ANCHOR_REPO and KSI_ANCHOR_TOKEN and the anchor is fetched from a separate
      # repository before the locker is verified, and appended back there after it is published,
      # under a credential that cannot write this repository. A principal who can rewrite the
      # evidence branch then cannot rewrite the record of how much evidence there was.
      #
      # Leave them unset and the anchor stays here, published alongside the evidence it protects
      # by the same `locker-sync publish` that pushes `.locker` — so it detects evidence lost by
      # accident and NOT deliberate truncation by anyone able to write the evidence branch. That
      # is the mode this repository runs in, because a repository whose only subject is itself
      # has no second trust domain to reach for. `anchor-sync` prints which mode is in force on
      # every run rather than leaving it to this comment.
      #
      # Note that the path alone was never the fix. Anything outside `.locker` is written after
      # collection and never restored, so repointing it without the fetch-and-append below would
      # make every run start from a fresh checkout, find no anchor, and report a clean
      # reconciliation forever — structurally unfalsifiable, and the same shape as the cadence
      # bug this workflow was rewritten to fix.
      ANCHOR_LOG: .locker/anchor.jsonl
      KSI_ANCHOR_REPO: ${{ vars.KSI_ANCHOR_REPO }}
      KSI_ANCHOR_BRANCH: ${{ vars.KSI_ANCHOR_BRANCH }}
      KSI_ANCHOR_FILE: ${{ vars.KSI_ANCHOR_FILE }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Verify the FedRAMP ruleset pin
        run: npm run vendor:verify

      # Step one, and the fix for the bug that made everything below it decorative. The clone is
      # deliberately not shallow: the locker's own history is the evidence of recurrence, and a
      # depth-1 clone would discard it while appearing to work.
      - name: Restore the evidence locker
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/locker-sync.mjs restore .locker

      # Verify what was restored before adding to it. A chain break found here means the locker was
      # rewritten between runs, and collecting on top of it would extend a chain that already lies.
      #
      # The anchor is checked alongside it because the chain cannot see deletion: it proves the
      # consistency of what is present and says nothing about what is gone, so a locker with
      # two-thirds of a check's history removed and its manifest regenerated passes every other
      # check in this file.
      # Before verification, because verification is what consumes it. Fetched from its own
      # repository when one is configured, and reported as co-located when not — the mode is
      # printed on every run rather than inferred from a comment.
      - name: Restore the anchor log
        env:
          KSI_ANCHOR_TOKEN: ${{ secrets.KSI_ANCHOR_TOKEN }}
        run: node scripts/anchor-sync.mjs restore "$ANCHOR_LOG"

      - name: Verify the restored locker
        run: |
          if [ -f "$ANCHOR_LOG" ]; then
            node src/cli.mjs verify --evidence "$LOCKER" --anchor "$ANCHOR_LOG"
          else
            echo "No anchor log at $ANCHOR_LOG yet; verifying integrity only."
            node src/cli.mjs verify --evidence "$LOCKER"
          fi

      # Which mode applies is decided once, here, and reported. The alternative — falling back to
      # fixtures without saying so — would put demo data in a locker that everything downstream
      # treats as real, which is the worst bug this repository could ship.
      - name: Decide the collection mode
        id: mode
        env:
          ROLE: ${{ secrets.AWS_COLLECTOR_ROLE_ARN }}
        run: |
          if [ "${{ inputs.fixtures_only }}" = "true" ]; then
            mode=fixtures
          elif [ -n "$ROLE" ]; then
            mode=live
          else
            mode=github-live
          fi
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "Collection mode: $mode (profile $PROFILE)"

      - name: Assume the read-only collector role
        if: steps.mode.outputs.mode == 'live'
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ secrets.AWS_COLLECTOR_ROLE_ARN }}
          aws-region: us-east-1
          role-session-name: ksi-harness-ccm

      - name: Collect every declared check
        if: steps.mode.outputs.mode == 'live'
        env:
          GITHUB_TOKEN: ${{ secrets.KSI_GITHUB_READ_TOKEN || github.token }}
        run: node src/cli.mjs collect --profile "$PROFILE" --out "$LOCKER"

      - name: Collect the checks these credentials can actually evidence
        if: steps.mode.outputs.mode == 'github-live'
        env:
          GITHUB_TOKEN: ${{ secrets.KSI_GITHUB_READ_TOKEN || github.token }}
        run: node src/cli.mjs collect --profile "$PROFILE" --only github --out "$LOCKER"

      # Fixture evidence goes to a throwaway directory, never to the locker. A demo bundle in a
      # persisted locker would be indistinguishable from real evidence to every later run, and the
      # `scope.fixture` marker only helps a reader who is looking for it.
      - name: Collect fixture evidence
        if: steps.mode.outputs.mode == 'fixtures'
        run: node src/cli.mjs collect --profile examples/northwind.profile.yaml --fixture fixtures/collectors --out .evidence-demo

      - name: Coverage report
        env:
          EVIDENCE: ${{ steps.mode.outputs.mode == 'fixtures' && '.evidence-demo' || '.locker/evidence' }}
        run: |
          node src/cli.mjs coverage --evidence "$EVIDENCE" --md out/coverage.md --json out/coverage.json
          cat out/coverage.md >> "$GITHUB_STEP_SUMMARY"

      # What moved since the last collection. This is the artifact continuous monitoring is for and
      # the one that was impossible to produce while the locker was discarded every run.
      - name: What changed since the last collection
        if: steps.mode.outputs.mode != 'fixtures'
        run: |
          node src/cli.mjs diff --evidence "$LOCKER" --md out/diff.md --json out/diff.json
          cat out/diff.md >> "$GITHUB_STEP_SUMMARY"

      # Drift in the upstream ruleset is a separate failure from drift in the environment, and it is
      # the one nobody watches. A new indicator, or a changed statement, silently invalidates the
      # routing map and every narrative generated from it.
      - name: Check the upstream ruleset for drift
        continue-on-error: true
        run: node src/cli.mjs drift --md out/drift.md

      # The chain proves the locker is internally consistent. It cannot prove the locker was not
      # rewritten end to end, because a wholesale rewrite produces a perfectly consistent chain with
      # a different head. Signing the manifest — which pins every head at a point in time — with a
      # keyless certificate bound to this workflow's identity is what closes that, because it is a
      # signature this repository's own code cannot forge.
      # Trusted time, before signing. The chain establishes the order of a check's history but
      # every timestamp in it comes from this runner's clock, so a bundle asserts its own age.
      # A Time Stamping Authority signs the manifest root together with its own time, which
      # turns "this evidence claims to be from Tuesday" into a third party attesting that it
      # existed by Tuesday. Skipped rather than failed when no authority is configured: which
      # one to trust is a programme decision, not a default this workflow should make.
      - name: Obtain a trusted timestamp over the manifest root
        if: steps.mode.outputs.mode != 'fixtures' && vars.KSI_TSA_URL != ''
        env:
          KSI_TSA_URL: ${{ vars.KSI_TSA_URL }}
        run: node src/cli.mjs timestamp --evidence "$LOCKER"

      # cosign is installed from its release rather than through sigstore/cosign-installer for the
      # same reason actionlint is in ci.yml: this repository ships a check that fails any
      # third-party action pinned to a mutable tag, and pinning one to a revision means carrying a
      # revision somebody has to verify. A checksummed download has neither problem.
      - name: Sign the evidence manifest with a keyless certificate
        if: steps.mode.outputs.mode != 'fixtures'
        env:
          COSIGN_VERSION: 2.4.3
        run: |
          curl -fsSL -o /tmp/cosign \
            "https://github.com/sigstore/cosign/releases/download/v${COSIGN_VERSION}/cosign-linux-amd64"
          curl -fsSL -o /tmp/cosign_checksums.txt \
            "https://github.com/sigstore/cosign/releases/download/v${COSIGN_VERSION}/cosign_checksums.txt"
          grep " cosign-linux-amd64$" /tmp/cosign_checksums.txt \
            | sed 's| cosign-linux-amd64$|  /tmp/cosign|' \
            | sha256sum -c -
          chmod +x /tmp/cosign
          /tmp/cosign sign-blob --yes \
            --bundle "$LOCKER/MANIFEST.sigstore.json" \
            "$LOCKER/MANIFEST.json"
          echo "Signed manifest root: $(jq -r .root_sha256 "$LOCKER/MANIFEST.json")"

      # Record how much evidence there is, before publishing it. The anchor entry is what a later
      # run compares against, so it has to be written from the state this run actually produced —
      # and it is chained, so the log cannot be trimmed to match a truncated locker either.
      - name: Anchor the manifest root
        if: steps.mode.outputs.mode != 'fixtures'
        env:
          KSI_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: node src/cli.mjs publish --profile "$PROFILE" --evidence "$LOCKER" --anchor "$ANCHOR_LOG"

      # Last step in the collection path, and the counterpart to the restore. Without it the next
      # run starts from nothing and every cadence assessment goes back to reporting "only one run
      # so far", which is the failure this workflow was rewritten to fix.
      - name: Publish the evidence locker
        if: steps.mode.outputs.mode != 'fixtures'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          KSI_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          KSI_COMMIT_MESSAGE: Evidence collected in ${{ steps.mode.outputs.mode }} mode
        run: node scripts/locker-sync.mjs publish .locker

      # After the locker, so the anchor never claims evidence that failed to publish. The reverse
      # order would record a root that does not exist anywhere, and the next run would open with
      # a `root_unknown` finding against its own predecessor.
      #
      # `always()` is deliberately not used. An anchor written after a failed collection would
      # assert a state the evidence never reached.
      - name: Publish the anchor log
        if: steps.mode.outputs.mode != 'fixtures'
        env:
          KSI_ANCHOR_TOKEN: ${{ secrets.KSI_ANCHOR_TOKEN }}
          KSI_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: node scripts/anchor-sync.mjs publish "$ANCHOR_LOG"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: ccm-${{ github.run_number }}
          path: |
            out/
          # A convenience copy of the reports. The evidence itself lives on the locker branch, which
          # is the durable record; an artifact that expires cannot be the retention story for
          # indicators whose cadence is annual.
          retention-days: 120

      # Escalation never runs on fixture evidence: an issue raised from demo data is worse than no
      # issue at all. See scripts/ccm-issue.mjs for why this is a script rather than inline shell —
      # the first version silently did nothing for two separate reasons.
      # Notifies on *transition* rather than on state. A control failing for forty days is one
      # piece of news and thirty-nine reasons to stop reading, and a channel people have muted
      # is alerting that looks present and does nothing — the same silent-success shape this
      # repository hunts everywhere else.
      #
      # The sink comes from the profile. The github-issue sink is the one that can stand down,
      # because it owns a living issue it can close; a webhook or chat sink can only append, so
      # it fires on transitions only. An escalation that cannot stand down is half a control.
      - name: Notify on controls that changed state
        if: steps.mode.outputs.mode != 'fixtures'
        env:
          GH_TOKEN: ${{ github.token }}
          KSI_MODE: ${{ steps.mode.outputs.mode }}
          KSI_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          KSI_ALERT_WEBHOOK: ${{ secrets.KSI_ALERT_WEBHOOK }}
          KSI_SLACK_WEBHOOK: ${{ secrets.KSI_SLACK_WEBHOOK }}
        run: node src/cli.mjs notify --profile "$PROFILE" --evidence "$LOCKER" --sink "${{ vars.KSI_ALERT_SINK || 'github-issue' }}"
