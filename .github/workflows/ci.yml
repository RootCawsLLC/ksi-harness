name: ci

# Third-party actions are pinned to commit revisions rather than tags, because
# github.supply-chain.workflow-pinning is a check this repository ships and failing your own
# control in your own pipeline is not a good look. First-party actions/* are pinned too, since
# the check only warns on them and the warning is still correct.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  ACTIONLINT_VERSION: 1.7.12

jobs:
  # Where a pull request came from, which CODEOWNERS silently depends on.
  #
  # That file's reasoning opens "every pull request on this repository is opened by `xnasusx` and
  # carries commits authored by `RootCawsLLC`". The conclusion it draws from that -- leave
  # `require_code_owner_reviews` off, because enabling it would let a RootCawsLLC approval satisfy a
  # requirement it does not really satisfy -- is only sound while the premise holds.
  #
  # Nothing enforced the premise, and #27 broke it: a pull request opened from this repository, by
  # the account that owns it. Since RootCawsLLC is the only collaborator and GitHub forbids
  # approving your own pull request, that PR could not be approved by anybody. The review
  # requirement was not inconvenient, it was unsatisfiable -- so the only way to merge was to
  # relax the protection, and the protection was relaxed.
  #
  # That is the failure mode worth refusing. A rule whose ordinary response is "turn the rule off"
  # decays whether or not anyone intends it to, and the decay leaves no record: branch protection
  # carries no modification history and a personal account has no audit log, so afterwards there is
  # no way to establish what was changed or for how long.
  #
  # So the check is here rather than in a hook. A pre-push hook would give faster feedback and could
  # be skipped by the person it is meant to stop; this runs on the pull request itself, reports on
  # it, and can be made a required context.
  provenance:
    runs-on: ubuntu-latest
    steps:
      # Every value comes through `env` rather than being interpolated into the script. A fork can
      # choose its own repository and branch names, and those strings would otherwise be pasted
      # into a shell by the runner before bash ever sees them -- the injection this repository
      # ships policy rules about.
      - name: Refuse a pull request opened from this repository
        env:
          EVENT: ${{ github.event_name }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          BASE_REPO: ${{ github.repository }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          # Deliberately not skipped with a job-level `if`. A skipped job reports as skipped rather
          # than as success, and a required context that reports skipped is a required context that
          # blocks -- so the job always runs and decides here.
          if [ "$EVENT" != "pull_request" ]; then
            echo "Not a pull request (${EVENT}); provenance is not a question here."
            exit 0
          fi

          if [ "$HEAD_REPO" != "$BASE_REPO" ]; then
            echo "Opened from ${HEAD_REPO}, which is not ${BASE_REPO}. Independent approval is possible."
            exit 0
          fi

          # Dependabot opens same-repository branches and cannot do otherwise. Its commits are
          # authored by the bot, so an approval from RootCawsLLC is independent of the author and
          # the requirement means what it says. Named explicitly rather than exempting bots as a
          # class: a second bot should be a decision, not something this check discovers.
          if [ "$AUTHOR" = "dependabot[bot]" ]; then
            echo "Opened from ${BASE_REPO} by ${AUTHOR}, which cannot fork. Its commits are not authored by the reviewer."
            exit 0
          fi

          echo "::error::Pull request opened from ${BASE_REPO} by ${AUTHOR} rather than from a fork."
          cat <<'WHY'

          Open it from the fork instead.

          RootCawsLLC is the only collaborator on this repository and GitHub does not allow
          approving your own pull request. A pull request opened from this repository by that
          account therefore cannot be approved by anyone, so the required review is not merely
          awkward to obtain -- it is impossible, and the only route to merging is to weaken the
          branch protection.

          That happened once already, on #27, and it left no record: branch protection has no
          modification history and a personal account has no audit log.

          .github/CODEOWNERS explains why the two-account arrangement is load-bearing. This check
          exists to keep its opening premise true.
          WHY
          exit 1

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # The pin is verified before anything is generated from it. A report is only meaningful
      # against a known ruleset, and a silently changed vendor file would invalidate every
      # artifact this run produces.
      - name: Verify the FedRAMP ruleset pin
        run: npm run vendor:verify

      - name: Validate the routing map
        run: npm run routes:validate

      # `ccm.yml` once shipped a `permissions:` key GitHub does not accept, so it failed to parse and
      # every scheduled run died in under a second. Nothing caught it: the required checks all live
      # in this file and in policy.yml, so the one workflow nobody's pull request exercises was also
      # the one with no coverage. Linting every workflow inside a required check closes that hole.
      #
      # The download is checksummed before it is executed. It used to be piped straight from curl
      # into tar, which runs whatever the release URL happened to serve — and this repository ships
      # `github.supply-chain.workflow-pinning`, which exists to fail that pattern in other people's
      # workflows. A gap in a check's own repository is worse than the same gap elsewhere, because
      # the repository is quoted as evidence that the check is worth adopting.
      #
      # Piping into tar also made the fetch unverifiable in principle rather than merely
      # unverified: a stream consumed as it arrives cannot be checked before it is used.
      - name: Lint the workflows
        run: |
          BASE="https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}"
          curl -fsSL -o /tmp/actionlint.tar.gz "${BASE}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -fsSL -o /tmp/actionlint_checksums.txt "${BASE}/actionlint_${ACTIONLINT_VERSION}_checksums.txt"
          # Only the filename is rewritten. The two-space separator sha256sum requires comes from
          # the checksums file and is left alone — substituting it is how the cosign step produced
          # three spaces and a filename with a leading space.
          grep " actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz$" /tmp/actionlint_checksums.txt \
            | sed "s|actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz$|/tmp/actionlint.tar.gz|" \
            | sha256sum -c -
          tar -xzf /tmp/actionlint.tar.gz -C /tmp actionlint
          /tmp/actionlint -color

      # Third-party actions are pinned to revisions and the npm tree is locked, which is the right
      # posture and also the one that goes stale invisibly. Dependabot proposes the updates; this
      # is what notices a high-severity advisory before dependabot gets to it.
      - name: Audit the runtime dependency tree
        run: npm run audit

      - run: npm test

  # Whether each lockfile agrees with its manifest about what kind of dependency each package is.
  #
  # Dependabot's regeneration writes "@aws-sdk/client-sts" into the root lockfile's `dependencies`
  # while package.json lists it only under optionalDependencies -- where the lockfile also still
  # lists it. It arrived on #31, was removed by #33, and came back identically on #35 at the next
  # version, so it is what happens on every aws-sdk bump rather than a slip that got through once.
  #
  # The first attempt at this regenerated the lockfile and diffed it, which is what #34 proposed
  # and is cheaper. Testing it is what ruled it out: `npm install --package-lock-only` does catch
  # the defect, but its output depends on the npm running it. npm 11.9.0 strips the `libc` fields
  # the committed web lockfile carries on @next/swc-linux-*, so that check reports drift whenever
  # the npm checking differs from the npm that generated the file -- which is the normal state of
  # affairs across dependabot, CI and a contributor's laptop.
  #
  # A required gate that goes red for reasons unconnected to the change is one people learn to
  # bypass, and this repository already has a control whose ordinary failure mode was disabling it
  # (#30). So the script compares the thing that is actually wrong and nothing else: it runs no
  # package manager, reads no network, and gives the same answer on every npm.
  lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      # No `npm ci`: the check reads the two files and needs nothing installed.
      - name: Lockfiles agree with their manifests on dependency class
        run: node scripts/lockfile-classes.mjs . web

  # The web GUI is built here because nothing else builds it.
  #
  # Every dependency bump against /web has been arriving with a full set of green checks that say
  # nothing about it: the app is never built, so `test`, `gate`, `scan` and `artifacts` all pass
  # while the framework, the types and the container go unexercised. #45 (node 22 -> 26), #50
  # (next 15 -> 16) and #51 (typescript 5 -> 7) are three major bumps that would each have merged
  # on evidence that did not exist.
  #
  # `next build` is the cheapest thing that produces real evidence. It type-checks the whole app on
  # the way through -- which is what makes it, rather than `tsc --noEmit`, the check that covers a
  # TypeScript major -- and it fails on the App Router API changes a Next major is most likely to
  # break. It does not cover the Dockerfile, and that gap is stated rather than implied: a runtime
  # bump still needs a container build nobody runs yet.
  #
  # `npm ci` rather than `npm install`: the lockfile is committed and a build that silently
  # resolved different versions from the ones under review would defeat the point of building.
  web-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      # `ksi-harness` is a `file:..` dependency, so the parent has to be installable before the
      # web app can resolve it.
      - name: Install the tool the GUI links to
        run: npm ci

      - name: Install the web app
        working-directory: web
        run: npm ci

      # Type errors are build errors here. `eslint.ignoreDuringBuilds` is set in next.config.mjs,
      # so linting is deliberately not part of this and is not claimed to be.
      - name: Build the web app
        working-directory: web
        run: npm run build

  artifacts:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # Proves the whole path end to end on every change: collect, report, emit, schema-validate.
      # The emitters fail the run rather than writing a document FedRAMP would reject on
      # submission, so a schema regression is caught here rather than in a certification cycle.
      # Twice, so the locker holds two collections. One run cannot exercise the hash chain, the
      # manifest, or `ksi diff` — and a pipeline that only ever produces one collection is exactly
      # the bug that made the cadence assessment inert, so the end-to-end path should not be able
      # to pass without a second one.
      - name: Collect fixture evidence, twice
        run: |
          npm run collect:fixture
          npm run collect:fixture

      - name: Verify the evidence chain and the manifest root
        run: node src/cli.mjs verify --evidence .evidence --manifest .evidence/MANIFEST.json

      - name: Coverage report
        run: node src/cli.mjs coverage --evidence .evidence --md out/coverage.md --json out/coverage.json

      - name: Change report between the two collections
        run: node src/cli.mjs diff --evidence .evidence --md out/diff.md

      - name: Emit FedRAMP 20x artifacts
        run: |
          node src/cli.mjs emit sdr \
            --evidence .evidence \
            --profile examples/northwind.profile.yaml \
            --overview-uri "https://northwind.example/fedramp/overview.json" \
            --out out/sdr.json
          node src/cli.mjs emit ocr \
            --evidence .evidence \
            --profile examples/northwind.profile.yaml \
            --overview-uri "https://northwind.example/fedramp/overview.json" \
            --out out/ocr.json

      - name: Emit a Significant Change Notification
        run: |
          node src/cli.mjs emit scn \
            --evidence .evidence \
            --change examples/change.scn.yaml \
            --overview-uri "https://northwind.example/fedramp/overview.json" \
            --out out/scn.json

      - name: Emit OSCAL assessment results
        run: node src/cli.mjs emit oscal-ar --evidence .evidence --out out/oscal-assessment-results.json

      - name: Summarize coverage in the run
        run: cat out/coverage.md >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: artifacts
          path: |
            out/
            .evidence/
          retention-days: 30
