# Example service profile.
#
# The profile is where the certification boundary is *declared*. Nothing in this harness
# discovers scope from the environment, which is a deliberate constraint rather than a missing
# feature: if collection enumerated whatever it could see, a new account or repository would
# join the authorization boundary without anyone deciding it should, and the evidence would
# quietly redefine what was certified.

service_name: Northwind Voice API
provider: Northwind Systems, Inc.

# Class C (Moderate-equivalent) is the practical ceiling today: Class D has no 20x path and
# stays on Rev5, with a pilot targeted for FY27.
certification_class: c

# The authorization boundary, when it is a product mode rather than a network perimeter.
#
# Every other scope construct here is infrastructural — accounts, projects, regions, repos —
# and that works when the boundary is drawn around resources. It does not when the boundary is
# drawn around a *capability*, because that boundary moves when a feature flag moves and a
# harness enumerating infrastructure will not notice.
#
# So membership is a selector on the resource itself, and every enumerated resource lands in
# exactly one of three states: in, out, or unattributed. The third is the point. A resource
# nobody has attributed is in the boundary or outside it depending on who is asked, which is
# the condition an authorization exists to remove — so it fails rather than being filtered out.
boundary:
  description: >
    Text-to-Speech and Speech-to-Text, in zero-retention mode only. Voice cloning, analytics
    and telephony integrations are outside the boundary and are not deployed in the government
    environment.

  selector:
    gcp_label: fedramp-boundary
    aws_tag: FedRAMPBoundary
    in_values: [true, in-scope]
    out_values: [false, out-of-scope]

  in_scope:
    - id: tts
      name: Text to Speech
      condition: Zero retention mode only
    - id: stt
      name: Speech to Text
      condition: Zero retention mode only

  # Nothing here can confirm a product capability is switched off — that is a claim about
  # configuration, not infrastructure. Each exclusion therefore names the mechanism and the
  # person who attests to it, the same discipline the `manual` coverage level applies.
  out_of_scope:
    - id: voice-cloning
      name: Voice cloning
      excluded_by: >
        Not deployed in the government environment; the model endpoints are absent rather
        than disabled.
      attested_by: Platform engineering lead
    - id: telephony
      name: Telephony integrations
      excluded_by: Disabled by default and unavailable on the government tier.
      attested_by: Product security lead

aws:
  accounts:
    - id: "123456789012"
      regions: [us-east-1]
    - id: "210987654321"
      regions: [us-east-1, us-west-2]

  # The read-only role this harness assumes in each account. A bare name expands to
  # `arn:aws:iam::<account>:role/<name>`; a full ARN may use `{account}` as a placeholder.
  #
  # Required as soon as more than one account is in scope, and the run is refused without it.
  # Collecting several accounts on one ambient credential would file the same account's evidence
  # under every account id in the boundary — a complete-looking report over a boundary that was
  # never visited, which is worse than not running. An account this role cannot be assumed into
  # becomes a named gap in every affected population rather than an absence.
  collector_role: KsiHarnessReadOnly

  # Ports the service is intended to expose to the internet. Anything else reachable from
  # 0.0.0.0/0 is a finding rather than a design decision, and stating the intent here is what
  # lets the check tell those apart.
  public_ports: [80, 443]

# The GCP half of the boundary. Three of these keys are denominators rather than settings,
# and that is the point: `audited_services` is the list KSI-MLA-LET asks to be maintained,
# `required_constraints` is a statement of intended state that Organization Policy is then
# checked against, and `cmek_required_buckets` is what turns "note the key custody" into a
# claim that can fail. A check whose denominator came from the environment could only ever
# report what is there.
gcp:
  organization_id: "419827365104"
  projects:
    - id: northwind-voice-prod
    - id: northwind-voice-logs

  # Services whose Data Access logs must be on. These default to OFF on GCP, which is the
  # most common reason an investigation finds no record of a read.
  audited_services:
    - storage.googleapis.com
    - iam.googleapis.com
    - cloudkms.googleapis.com
    - secretmanager.googleapis.com

  # Principals permitted to read log data. Anything else with read access on a sink
  # destination is a least-privilege finding rather than a configuration detail.
  log_readers:
    - group:security@northwind.example
    - serviceAccount:siem-ingest@northwind-voice-logs.iam.gserviceaccount.com

  # Buckets that must hold customer-managed keys. Everything in GCS is encrypted at rest
  # unconditionally, so this declaration is what gives the check something to falsify.
  cmek_required_buckets:
    - northwind-customer-audio
    - northwind-voice-models

  # Organization Policy constraints required on every declared project. These are enforced
  # when the API call is made rather than after the fact, which makes them the preventive
  # counterpart to the detective collectors — the same pairing as the Terraform gate.
  required_constraints:
    - id: iam.disableServiceAccountKeyCreation
      why: prevents downloadable service account keys being created at all
    - id: storage.publicAccessPrevention
      why: prevents a bucket being made public regardless of its own IAM
    - id: sql.restrictPublicIp
      why: prevents a database being given a public address
    - id: compute.requireOsLogin
      why: forces SSH through IAM rather than metadata-distributed keys

github:
  repositories:
    - name: northwind/platform
      branch: main
    - name: northwind/infra
      branch: main
    - name: northwind/docs
      branch: main
  window_days: 30

# The pre-merge policy gate. `iac_roots` is the declared scope for infrastructure as code, and it
# is enumerated from the working tree rather than taken from the policy tool's own report: a file
# that exists in a gated root but never reached the gate has to be detectable, and it is not if
# the population is read out of the report that omitted it.
pipeline:
  iac_roots:
    - policy/terraform/compliant
  policy_source: policy/rego
  policy_report: .policy/conftest-report.json

# Contacts that appear in generated 20x artifacts.
contacts:
  security: security@northwind.example
  incident_reporting: soc@northwind.example

# The Certification Package Overview (FRC-CSO-PKG) — the document every other artifact's
# `certificationPackageOverviewUri` points at. It is declaration rather than observation, so
# it lives here rather than being derived from evidence: no cloud account knows what a company
# is called or how it sells.
#
#   ksi emit overview --profile examples/northwind.profile.yaml --out out/overview.json
certification:
  package_id: FR0000000000
  uei: NWDVOICE1234
  service_acronym: NVA
  type: 20x
  website: https://northwind.example/voice-api
  logo: https://northwind.example/assets/logo.png
  description: >
    Northwind Voice API provides speech synthesis and transcription over a REST interface.
    The authorization boundary covers the synthesis and transcription paths only; the
    analytics and voice-cloning surfaces are outside it and are disabled by default for
    government tenants.
  service_model: [SaaS]
  deployment_model: Government Community Cloud
  business_category:
    - Artificial Intelligence (AI)
    - Communication

  trust_center:
    url: https://northwind.example/trust
    description: Policies, assessment reports and the current KSI coverage report.
    authentication_required: false
    types: [Trust Center, Assessment Reports]

  # FRC-CSO-PKG requires a Security contact *and* a Sales contact. The schema expresses that
  # as two `contains` clauses, which ajv reports abstractly — the emitter checks it directly
  # so a missing role is named rather than discovered at submission.
  contacts:
    - type: Security
      name: Security Operations
      email: security@northwind.example
    - type: Sales
      name: Federal Sales
      email: gov-sales@northwind.example
    - type: Primary
      name: Compliance Lead
      email: compliance@northwind.example
      phone: 202-555-0123

  certified_services:
    - name: Northwind Speech Synthesis
      description: Text-to-speech over REST, in zero-retention mode only.
      date_available: 2026-08-03

  # MAS-CSO-TPR. A non-certified dependency inside a package targeting certification is a
  # boundary question somebody has to answer; declaring it here puts it in front of a
  # reviewer at the start rather than at assessment.
  third_party:
    certified:
      - id: FR1805751477
        use_case: Primary compute, storage and networking for the synthesis path.
    non_certified:
      - name: Atlas
        provider: MongoDB
        website: https://www.mongodb.com/atlas
        use_case: >
          Tenant metadata and job queue state. Commercial tier, not FedRAMP certified.
          Resolution is open: move to a certified tier, bring the data in-boundary, or
          scope it out.
