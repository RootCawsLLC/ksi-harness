# A single-provider boundary, and the reason this file exists alongside northwind.
#
# Coverage is not a property of the routing map alone. `KSI-CNA-DFP` declares its sufficiency
# argument conditionally — it holds for a boundary whose providers can enumerate their own service
# surface — so the *same* routes.yaml resolves that indicator to `automated` here and to `partial`
# for northwind, which also declares AWS accounts. Neither answer is a compromise; they are
# different true statements about different estates.
#
# That is the point ADR 0011 makes, and this profile is how to see it:
#
#   ksi coverage --profile examples/skylark.profile.yaml    # KSI-CNA-DFP automated
#   ksi coverage --profile examples/northwind.profile.yaml  # KSI-CNA-DFP partial, with the gap
#   ksi coverage                                            # partial: unresolved, no profile given
#
# Everything else here is deliberately small. This is a boundary for demonstrating one mechanism,
# not a second worked example of a whole programme — northwind is that.

service_name: Skylark Transcription
provider: Skylark Systems Ltd
class: c

boundary:
  description: >
    Batch speech-to-text over customer-supplied audio, in zero-retention mode only. Audio is
    processed in memory and never written to durable storage. Real-time streaming and speaker
    diarisation are out of scope and disabled at the service level.
  selector:
    gcp_label: skylark-boundary
  in_scope_values: [in]
  out_of_scope_values: [out]
  capabilities:
    - id: batch-transcription
      description: Batch speech-to-text over customer-supplied audio.
    - id: zero-retention
      description: Audio is held in memory for the duration of the request and never persisted.
  out_of_scope:
    - id: realtime-streaming
      description: Streaming transcription over a persistent connection.
      excluded_by: Not offered to federal customers; disabled at the service level.
      attested_by: Head of Platform
    - id: diarisation
      description: Speaker separation and labelling.
      excluded_by: Requires retaining voice characteristics, which the boundary forbids.
      attested_by: Head of Platform

# One provider. That is what makes KSI-CNA-DFP's sufficiency condition hold here: every provider
# in this boundary can enumerate its own service surface, so "functionality is strictly defined"
# has an authoritative enumeration to be checked against rather than an inventory somebody keeps
# by hand.
gcp:
  organization_id: "778341290655"
  projects:
    - id: skylark-transcribe-prod
      intended_services:
        - run.googleapis.com
        - speech.googleapis.com
        - secretmanager.googleapis.com
        - cloudkms.googleapis.com

  audited_services:
    - storage.googleapis.com
    - iam.googleapis.com
    - cloudkms.googleapis.com
    - secretmanager.googleapis.com

  log_readers:
    - group:security@skylark.example

  cmek_required_buckets:
    - skylark-transcribe-artifacts

  required_constraints:
    - id: iam.disableServiceAccountKeyCreation
      why: prevents downloadable service account keys being created at all
    - id: storage.publicAccessPrevention
      why: prevents a bucket being made public regardless of its own IAM
    - id: run.allowedIngress
      why: keeps the transcription service off the public internet

# The identity provider, which is the only place that knows whether an account was created by
# automation or by a person at a console. KSI-IAM-AAM asks about the mechanism rather than the
# outcome, and the mechanism is unrecoverable from the resulting permissions — a hand-built account
# with flawless privileges is indistinguishable downstream from a provisioned one.
idp:
  provider: okta
  domain: skylark.okta.com
  token_env: KSI_OKTA_TOKEN

  # Provisioning sources that count as automation. Anything outside this list means somebody
  # created the account, so nothing removes it when that somebody forgets.
  automated_sources:
    - ACTIVE_DIRECTORY
    - SCIM
    - HR_IMPORT

  # Groups whose membership must come from a rule rather than hand curation. Access added by hand
  # is removed by hand, which is the leaver problem stated as a configuration property.
  privileged_groups:
    - Platform Admins
    - Transcription Engineers

  # The authoritative roster of people who still work here, and the only thing that can say
  # whether an account should still exist. Read by idp.account.roster: a live account whose worker
  # record has ended is a finding, and provisioning being automated does not make it one less.
  #
  # An export rather than an API. Every HRIS worth reconciling against produces one, it is what an
  # assessor will be shown anyway, and a normaliser written against a vendor API nobody here has
  # ever received a response from is the mistake this harness already declines to make for Entra.
  #
  # max_age_days is load-bearing. A roster is a snapshot, and a stale snapshot still lists a leaver
  # as employed — so without it the check reads clean for exactly as long as nobody refreshes the
  # export. Seven days is deliberately shorter than any plausible notice period; the window being
  # closed is the one between a termination and the account being disabled.
  hr_source:
    kind: file
    path: ./hr/roster.json
    max_age_days: 7

  # Identities the roster is not expected to contain, named one at a time. A prefix convention
  # would be less typing and is exactly why this is not one: `svc-` is a name, and a name is
  # something an orphaned account can be given. The exclusion has to be granted by the profile
  # rather than by the estate being assessed.
  non_human_accounts:
    - svc-transcode@skylark.example

# Transport security, and the one parameter this harness cannot resolve from the pinned ruleset.
#
# Every other parameterised judgement here comes from the vendored FedRAMP rules, because a
# hand-copied rule goes stale while reading as current. There is no TLS version to copy: the CTL
# entry for sc-13 says to follow the FedRAMP Cryptographic Module Use rules and carries no number.
# So the floor is declared, it is recorded in the scope of every bundle graded against it, and the
# route says plainly that the number came from here rather than from the ruleset.
#
# Note what a version floor does not establish. sc-13 is about *validated* cryptographic modules,
# and a listener negotiating TLS 1.2 with a non-validated module satisfies this and not the
# control. Nothing a describe call returns tells those apart.
transit:
  min_tls_version: "1.2"

  # The paths that are machine-to-machine, which is the scope KSI-SVC-VCM actually claims. An
  # internet-facing load balancer serving browsers is not one, and requiring client certificates of
  # it would be a finding against a correct configuration — so this is a declaration rather than a
  # discovery, the same shape as cmek_required_buckets.
  #
  # The cost is stated on the route: a machine-to-machine path nobody lists here is invisible to
  # the check. Declaring nothing produces a population with nothing decidable in it, which reports
  # as a warning rather than as a pass — an admission, not coverage.
  mutual_auth_required:
    gcp:
      - transcribe-dispatch
      - transcribe-workers

evidence:
  # No store declared, so the locker is the filesystem and `ksi store` says so rather than
  # implying durability nobody configured. A real deployment of this boundary would declare one.
  anchor_log: .anchors/skylark.jsonl

alerting:
  sink:
    kind: stdout
